name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test --extra docs --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check tests/ docs/

      - name: Format check
        run: uv run ruff format --check tests/ docs/

      - name: Test
        run: uv run pytest -v

      - name: Build docs
        if: matrix.python-version == '3.12'
        run: uv run mkdocs build --strict
