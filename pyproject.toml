[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "swishbot"
dynamic = ["version"]
description = "Install data stack skills into your Claude environment"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Swish BI Limited" }]
keywords = [
    "analytics",
    "claude",
    "dagster",
    "data-engineering",
    "dbt",
    "dlt",
    "powerbi",
    "python",
    "skills",
    "terraform",
]

[project.scripts]
swishbot = "swishbot.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0", "ruff>=0.4", "pre-commit>=3.0"]
docs = ["mkdocs-material>=9.0"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/swishbot/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/swishbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["src/swishbot/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
