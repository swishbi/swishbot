[project]
name = "swishbot"
version = "1.0.0"
description = "Data stack skills and agents plugin for Claude Code"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Swish BI Limited" }]
keywords = [
    "analytics",
    "claude",
    "dagster",
    "data-engineering",
    "dbt",
    "dlt",
    "powerbi",
    "python",
    "skills",
    "terraform",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "ruff>=0.4"]
docs = ["mkdocs-material>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
