#
# One view per subject, shared by every consumer group allowed to see it.
# A view exposes exactly the members its includes list, and only the groups
# in its access policy may query it. The BI tool and the AI agent log in
# separately (their own SQL API users and groups) but read the same view, so
# a number means the same thing in a dashboard and in an agent's answer.
views:
  - name: finance_profit_and_loss
    title: "Profit and loss"
    description: "Monthly P&L by account, for the BI tool and the business's AI agent."
    access_policy:
      - group: metabase
        row_level:
          allow_all: true
      - group: agent
        row_level:
          allow_all: true
    cubes:
      - join_path: rpt_quickbooks_profit_and_loss
        includes:
          - net_profit
          - account_count
          - month_start
          - account_id
      - join_path: rpt_quickbooks_profit_and_loss.dim_quickbooks_account
        includes:
          - account_name
          - account_number
          - account_type
          - account_classification
