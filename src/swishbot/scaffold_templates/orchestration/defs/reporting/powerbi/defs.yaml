# Power BI Component Definition
# Represents Power BI dashboards, reports, and semantic models as Dagster assets.

type: orchestration.defs.reporting.powerbi.component.CustomPowerBIWorkspaceComponent

attributes:
  workspace:
    workspace_id: "{{ env.POWERBI_WORKSPACE_ID }}"
    credentials:
      client_id: "{{ env.POWERBI_CLIENT_ID }}"
      client_secret: "{{ env.POWERBI_CLIENT_SECRET }}"
      tenant_id: "{{ env.POWERBI_TENANT_ID }}"
  enable_semantic_model_refresh: True
  translation:
    group_name: powerbi
    description: "PowerBI {{ data.content_type.value }}: {{ data.properties.name }}"
    for_semantic_model:
      tags:
        is_semantic_model: "true"

requirements:
  env:
    - POWERBI_TENANT_ID
    - POWERBI_CLIENT_ID
    - POWERBI_CLIENT_SECRET
    - POWERBI_WORKSPACE_ID
