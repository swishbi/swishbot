[project]
name = "{project_name}"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-dbt",
    "dagster-dlt",
    "dagster-powerbi",
    "dbt-core",
    "dbt-duckdb",
    "dbt-snowflake",
    "dlt[snowflake]",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestration"]

[tool.dg]
is_component_lib = false

[tool.dagster]
module_name = "orchestration.definitions"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
