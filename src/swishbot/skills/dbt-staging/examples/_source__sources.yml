version: 2

sources:
  - name: source_name
    description: ""
    database: "{{ var('source_name_database', 'raw' if target.name == 'prod' else 'raw_dev') }}"
    schema: "{{ var('source_name_schema', 'source_name') }}"

    # loader: dlt
    # loaded_at_field: inserted_at

    # freshness:
    #   warn_after: { count: 72, period: hour }
    #   error_after: { count: 168, period: hour }

    tables:
      - name: _dlt_loads
        description: ""
        columns:
          - name: load_id
            description: ""
          - name: schema_name
            description: ""
          - name: status
            description: ""
          - name: inserted_at
            description: ""
          - name: schema_version_hash
            description: ""

      - name: _dlt_pipeline_state
        description: ""
        columns:
          - name: version
            description: ""
          - name: engine_version
            description: ""
          - name: pipeline_name
            description: ""
          - name: state
            description: ""
          - name: created_at
            description: ""
          - name: version_hash
            description: ""
          - name: _dlt_id
            description: ""
          - name: _dlt_load_id
            description: ""

      - name: _dlt_version
        description: ""
        columns:
          - name: version
            description: ""
          - name: engine_version
            description: ""
          - name: inserted_at
            description: ""
          - name: schema_name
            description: ""
          - name: version_hash
            description: ""
          - name: schema
            description: ""

      - name: entities
        description: ""
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - _dlt_id
                - _dlt_valid_from
              config:
                enabled: "{{ var('source_name_scd2_enabled', false) or ('scd2' in (env_var('SOURCES__SOURCE_NAME_PIPELINE__WRITE_DISPOSITION', '') | lower)) }}"
                severity: warn
        columns:
          - name: type
            description: ""
          - name: id
            description: ""
            data_tests:
              - not_null
              - unique:
                  config:
                    enabled: "{{ not var('source_name_scd2_enabled', false) and ('scd2' not in (env_var('SOURCES__SOURCE_NAME_PIPELINE__WRITE_DISPOSITION', '') | lower)) }}"
                    severity: warn
          - name: attributes
            description: ""
          - name: _dlt_id
            description: ""
            data_tests:
              - not_null
              - unique:
                  config:
                    enabled: "{{ not var('source_name_scd2_enabled', false) and ('scd2' not in (env_var('SOURCES__SOURCE_NAME_PIPELINE__WRITE_DISPOSITION', '') | lower)) }}"
                    severity: warn
          - name: _dlt_load_id
            description: ""
          - name: _dlt_valid_from
            description: ""
          - name: _dlt_valid_to
            description: ""

      - name: other_table
        description: ""
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - _dlt_id
                - _dlt_valid_from
              config:
                enabled: "{{ var('source_name_scd2_enabled', false) or ('scd2' in (env_var('SOURCES__SOURCE_NAME_PIPELINE__WRITE_DISPOSITION', '') | lower)) }}"
                severity: warn
        columns:
          - name: type
            description: ""
          - name: id
            description: ""
            data_tests:
              - not_null
              - unique:
                  config:
                    enabled: "{{ not var('source_name_scd2_enabled', false) and ('scd2' not in (env_var('SOURCES__SOURCE_NAME_PIPELINE__WRITE_DISPOSITION', '') | lower)) }}"
                    severity: warn
          - name: attributes
            description: ""
          - name: _dlt_id
            description: ""
            data_tests:
              - not_null
              - unique:
                  config:
                    enabled: "{{ not var('source_name_scd2_enabled', false) and ('scd2' not in (env_var('SOURCES__SOURCE_NAME_PIPELINE__WRITE_DISPOSITION', '') | lower)) }}"
                    severity: warn
          - name: _dlt_load_id
            description: ""
          - name: _dlt_valid_from
            description: ""
          - name: _dlt_valid_to
            description: ""
