version: 2

sources:
  - name: source_name
    description: ""
    database: "{{ var('source_name_database', '<default_database>') }}"
    schema: "{{ var('source_name_schema', 'source_name') }}"

    # loader: <loader_name>
    # loaded_at_field: <timestamp_column>

    # freshness:
    #   warn_after: { count: 72, period: hour }
    #   error_after: { count: 168, period: hour }

    tables:
      - name: entities
        description: ""
        columns:
          - name: id
            description: ""
            data_tests:
              - not_null
              - unique
          - name: name
            description: ""
          - name: status
            description: ""
          - name: account_id
            description: ""
          - name: is_active
            description: ""
          - name: created_at
            description: ""
          - name: updated_at
            description: ""

      - name: other_table
        description: ""
        columns:
          - name: id
            description: ""
            data_tests:
              - not_null
              - unique
          - name: type
            description: ""
          - name: amount
            description: ""
